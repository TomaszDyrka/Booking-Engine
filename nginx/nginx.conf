server {
    listen 80;
    server_name bookingapp.com;

    location /static/ {
        alias /static/;
    }

    location / {
        proxy_pass http://booking-backend-service:80;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    
    location /health {
    	return 200 'OK';
    }
}
