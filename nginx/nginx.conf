server {
    listen 80;
    server_name bookingapp.com;

    location /static/ {
        alias /app/core/staticfiles/;
    }

    location / {
        proxy_pass http://backend-prod:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
