# -------------------
# SETTINGS
# -------------------
default:
  image: docker:24.0.5-cli
  services:
    - docker:24.0.5-dind

variables:
  DOCKER_TLS_CERTDIR: "/certs"
  IMAGE_NAME: "django-app"

  # postgres vars
  POSTGRES_DB: "booking_db"
  POSTGRES_USER: "django_admin"
  POSTGRES_PASSWORD: "12345678"
  POSTGRES_HOST: "booking-db-service"
  SECRET_KEY: "ultrasecretkey"

stages:
  - build
  - test

# -------------------
# JOBS
# -------------------
build-job:
  stage: build
  tags:
    - docker
  before_script:
    - docker info # making sure it has docker available
  script:
    - docker build --target test -f Dockerfile.Backend -t ${IMAGE_NAME}:${CI_COMMIT_SHORT_SHA} .
    - docker save ${IMAGE_NAME}:${CI_COMMIT_SHORT_SHA} -o django-backend.tar
  artifacts:
    paths:
      - django-backend.tar
    expire_in: 1 hour

test-job:
  stage: test
  environment: test
  tags:
    - docker
  needs: ["build-job"]
  before_script:
    - docker load -i django-backend.tar
    - docker network create test-net
    - |
      docker run -d \
        --network=test-net \
        --name booking-db-service \
        --env POSTGRES_DB=${POSTGRES_DB} \
        --env POSTGRES_USER=${POSTGRES_USER} \
        --env POSTGRES_PASSWORD=${POSTGRES_PASSWORD} \
        postgres:15
    - |
      until docker exec booking-db-service pg_isready -U django_admin -d booking_db; do
        echo "Waiting for postgres..."
        sleep 1
      done
  script:
    - |
      docker run --rm \
      --network=test-net \
      --env POSTGRES_DB=${POSTGRES_DB} \
      --env POSTGRES_USER=${POSTGRES_USER} \
      --env POSTGRES_PASSWORD=${POSTGRES_PASSWORD} \
      --env POSTGRES_HOST=${POSTGRES_HOST} \
      --env SECRET_KEY=${SECRET_KEY} \
      --env DEBUG=True \
      ${IMAGE_NAME}:${CI_COMMIT_SHORT_SHA} \
      sh -c "uv run python -m pytest core/"

lint-job:
  stage: test
  environment: test
  tags:
    - docker
  needs: ["build-job"]
  before_script:
    - docker load -i django-backend.tar
  script:
    - docker run --rm ${IMAGE_NAME}:${CI_COMMIT_SHORT_SHA} sh -c "uv run ruff format --check core/ && uv run ruff check core/"
