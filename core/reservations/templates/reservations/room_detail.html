<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Calendar</title>
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/pl.js"></script>

    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js'></script>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            var calendarEl = document.getElementById('calendar');
            
            var calendar = new FullCalendar.Calendar(calendarEl, {
                initialView: 'timeGridWeek', 
                locale: 'pl',
                
                headerToolbar: {
                    left: 'prev,next today',
                    center: 'title',
                    right: 'dayGridMonth,timeGridWeek,timeGridDay'
                },
                
                slotLabelFormat: {
                    hour: '2-digit',
                    minute: '2-digit',
                    hour12: false
                },
                
                eventTimeFormat: {
                    hour: '2-digit',
                    minute: '2-digit',
                    hour12: false
                },  

                events: '{% url "api_reservations" room.id %}',

                selectable: true,
                select: function(info) {
                    let sel_start = info.startStr;
                    let sel_end   = info.endStr;

                    document.getElementById('id_start_date').value = sel_start.slice(0, 16).replace('T', ' '); // dont know how to change it otherwise 
                    document.getElementById('id_end_date').value = sel_end.slice(0, 16).replace('T', ' ');
                    
                    document.getElementById('reservationModal').style.display = 'block';

                    console.log(sel_start, sel_end);
                }

            });

            calendar.render();

            flatpickr("#id_start_date, #id_end_date", {
                enableTime: true,
                time_24hr: true,
                dateFormat: "Y-m-d H:i",
                locale: "pl"
            });
        });
    </script>
    
    <style>
        body { margin: 40px 10px; padding: 0; font-family: Arial, Helvetica Neue, Helvetica, sans-serif; font-size: 14px; }
        #calendar { max-width: 1100px; margin: 0 auto; }
    </style>


</head>
<body>
    <div id='calendar'></div>

    <div id="reservationModal" style="display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; padding: 30px; border: 1px solid #ccc; box-shadow: 0 4px 8px rgba(0,0,0,0.1); z-index: 1000;">
        <h2>Nowa rezerwacja</h2>
        
        <form id="reservationForm" method="post" action="{% url 'reservation_create' room.id %}">
            {% csrf_token %}
            
            {{ form.as_p }}
            
            <button type="submit">Save</button>
            <button type="button" onclick="document.getElementById('reservationModal').style.display='none'">Cancel</button>
        </form>
    </div>

</body>
</html>
