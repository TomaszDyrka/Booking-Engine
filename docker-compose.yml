# only for local use, as it doesn't have
# .env files passed in secrets!!!
name: booking-engine

x-backend-base: &backend-base
  image: django-app
  depends_on:
    database:
      condition: service_healthy
  env_file:
    - path: .env_dir/.env_db
      required: true
    - path: .env_dir/.env_backend
      required: true


services:
  backend-test:
    profiles: ["backend-test"]
    <<: *backend-base
    build:
      context: .
      dockerfile: Dockerfile
      target: test
    environment:
      - DEBUG=True
    volumes:
      - .:/app
    command: sleep infinity

  backend-prod:
    profiles: ["prod", "backend-prod"]
    <<: *backend-base
    build:
      context: .
      dockerfile: Dockerfile
      target: prod
    volumes:
      - static_volume:/app/core/staticfiles  

  nginx:
    image: nginx:1.30-alpine
    profiles: ["prod", "server"]
    depends_on: 
      - backend-prod
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/app/core/staticfiles:ro  

  database:
    image: postgres:17.10
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      interval: 30s
      timeout: 60s
      retries: 3
      start_period: 60s
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file: 
      - path: .env_dir/.env_db
        required: true

volumes:
  static_volume:
  postgres_data:
