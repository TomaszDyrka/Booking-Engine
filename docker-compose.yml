# only for local use, as it doesn't have
# .env files passed in secrets!!!
name: booking-engine

x-backend-base: &backend-base
  depends_on:
    database:
      condition: service_healthy
  env_file:
    - path: .env_dir/.django_secrets
      required: true
    - path: .env_dir/.env_global
      required: true
    - path: .env_dir/.postgres_credentials
      required: true
  networks:
    app-network:
      aliases:
        - booking-backend-service

services:
  backend-test:
    profiles: ["backend-test"]
    <<: *backend-base
    image: django-app:test
    build:
      context: .
      dockerfile: Dockerfile.Backend
      target: test
    environment:
      - DEBUG=True
    volumes:
      - .:/app
    command: sleep infinity

  backend-prod:
    profiles: ["prod", "backend-prod"]
    <<: *backend-base
    image: django-app:prod
    build:
      context: .
      dockerfile: Dockerfile.Backend
      target: prod

  nginx:
    image: nginx-frontend
    profiles: ["prod", "server"]
    build:
      context: .
      dockerfile: Dockerfile.Frontend
    depends_on: 
      - backend-prod
    ports:
      - "80:80"
    networks:
      - app-network

  database:
    image: postgres:17.10
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      interval: 30s
      timeout: 60s
      retries: 3
      start_period: 60s
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file: 
      - path: .env_dir/.env_global
        required: true
      - path: .env_dir/.postgres_credentials
        required: true
    networks:
      app-network:
        aliases:
          - booking-db-service


networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
