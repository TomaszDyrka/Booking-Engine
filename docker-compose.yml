# only for local use, as it doesn't have
# .env files passed in secrets!!!
name: booking-engine

x-backend-base: &backend-base
  depends_on:
    database:
      condition: service_healthy
  env_file:
    - path: .env_dir/.django_secrets
      required: true
    - path: .env_dir/.env_global
      required: true
    - path: .env_dir/.postgres_credentials
      required: true
  networks:
    - app-network

services:
  backend-test:
    profiles: ["backend-test"]
    <<: *backend-base
    image: django-app:test
    build:
      context: .
      dockerfile: Dockerfile.Backend
      target: test
    working_dir: /app/core
    environment:
      - DEBUG=True
    volumes:
      - .:/app
    command: uv run python -m pytest

  backend-prod:
    profiles: ["prod", "backend-prod"]
    <<: *backend-base
    image: django-app:prod
    build:
      context: .
      dockerfile: Dockerfile.Backend
      target: prod
    command: >
      sh -c "/app/.venv/bin/python manage.py migrate && 
      (/app/.venv/bin/python manage.py createsuperuser --noinput --email=admin@test.com --pesel=12312312312 || true) &&
      exec /app/.venv/bin/gunicorn --bind 0.0.0.0:8000 core.wsgi" 
   
  # soooo unfortunatelly services in k8s and aliases here cant be interchangeable
  # I do not want to change anything in docker image nor I want to modify k8s manifests
  # so this is a proxy that translates port 8000 (django) to port 80 (nginx)
  backend-service:
    profiles: ["prod", "backend-prod"]
    image: alpine/socat
    command: TCP-LISTEN:80,fork,reuseaddr TCP:backend-prod:8000
    depends_on:
      - backend-prod
    restart: unless-stopped
    networks:
      app-network:
        aliases:
          - booking-backend-service
  
  nginx:
    image: nginx-frontend
    profiles: ["prod", "server"]
    build:
      context: .
      dockerfile: Dockerfile.Frontend
    depends_on: 
      - backend-service
    ports:
      - "8000:80"
    networks:
      - app-network

  database:
    image: postgres:17.10
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      interval: 30s
      timeout: 60s
      retries: 3
      start_period: 60s
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file: 
      - path: .env_dir/.env_global
        required: true
      - path: .env_dir/.postgres_credentials
        required: true
    networks:
      app-network:
        aliases:
          - booking-db-service

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
