apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: booking-backend
  name: booking-backend
  namespace: booking-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: booking-backend
  template:
    metadata:
      labels:
        app: booking-backend
    spec:
      # volumes
      volumes:
      - name: logs-volume
        emptyDir: 
          sizeLimit: 128Mi

      # checking for db to startup
      initContainers:
      - name: database-initial-readiness
        image: busybox:1.37
        command: ["sh", "-c", "until nc -z $POSTGRES_HOST $POSTGRES_PORT; do echo Waiting...; sleep 1; done"]
        env:
        - name: POSTGRES_HOST
          valueFrom:
            configMapKeyRef:
              name: backend-map
              key: POSTGRES_HOST
        - name: POSTGRES_PORT
          valueFrom:
            configMapKeyRef:
              name: backend-map
              key: POSTGRES_PORT

      # main container for app 
      containers:
      - name: backend
        image: django-app
        ports:
        - containerPort: 8000
        envFrom:
        - configMapRef:
            name: backend-map
        - secretRef:
            name: backend-secret
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /live
            port: 8000
          initialDelaySeconds: 1
          periodSeconds: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: 8000
          initialDelaySeconds: 1
          periodSeconds: 3
        volumeMounts:
        - mountPath: /app/logs
          name: logs-volume

      # for logs
      # TODO: add config to fluent-bit
      - name: logs-sidecar
        image: fluent/fluent-bit:5.1
        volumeMounts:
        - mountPath: /var/log/app
          name: logs-volume

---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: booking-backend
  name: booking-backend-service
  namespace: booking-app
spec:
  selector:
    app: booking-backend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000

---
apiVersion: v1
kind: ConfigMap
metadata:
  labels:
    app: booking-backend
  name: booking-map
  namespace: booking-app
data:
  POSTGRES_HOST: "booking-db-service"
  POSTGRES_PORT: "5432"
  DEBUG: "False"

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: booking-backend-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: booking-backend
  minReplicas: 1
  maxReplicas: 3
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 90

